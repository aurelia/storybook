name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify example versions are aligned
        run: npm run sync:versions:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint package
        run: npm run lint

      - name: Type-check package
        run: npm run typecheck

      - name: Test package
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm run verify:package

  e2e:
    name: Examples and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Lint examples
        run: npm run lint:examples

      - name: Type-check examples
        run: npm run typecheck:examples

      - name: Test example applications
        run: npm run test:examples

      - name: Build example applications
        run: npm run build:examples

      - name: Start every Storybook dev server
        run: npm run test:storybook-dev

      - name: Build all Storybooks
        run: npm run build:storybooks

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run stories with the Vitest addon in Chromium
        run: npm run test:storybook

      - name: Run e2e tests against every builder in Chromium
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
